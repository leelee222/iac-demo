name: IaC Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  terraform-security-scan:
    name: Terraform Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Run Checkov Security Scan
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli
          soft_fail: false
          skip_check: CKV_AWS_260

      - name: Upload Checkov Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: checkov-results
          path: results.sarif

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-security-scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [terraform-security-scan, terraform-plan]
    if: always()
    
    steps:
      - name: Report Status
        run: |
          echo "🛡️  Security Scan: ${{ needs.terraform-security-scan.result }}"
          echo "📋 Terraform Plan: ${{ needs.terraform-plan.result }}"
          
          if [[ "${{ needs.terraform-security-scan.result }}" == "failure" ]]; then
            echo "❌ Pipeline BLOCKED due to security issues!"
            exit 1
          fi
          
          echo "✅ All checks passed!"
