name: IaC Security Scan & AWS Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to AWS (yes/no)"
        required: true
        default: "no"

jobs:
  sast-scan:
    name: SAST - Semgrep Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep (SAST)
        run: |
          semgrep --version
          semgrep --config=auto .

  dependency-scan:
    name: Dependency Scan - Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  terraform-security-scan:
    name: Terraform Security Scan
    runs-on: ubuntu-latest
    needs: [sast-scan, dependency-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials for Backend
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Setup Python for Checkov
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          pip install checkov

      - name: Run Checkov Security Scan
        id: checkov
        run: |
          checkov --version
          checkov -d . \
            --framework terraform \
            --output cli \
            --output sarif \
            --output-file-path . \
            --soft-fail \
            --skip-check CKV_AWS_260,CKV2_AWS_41,CKV_AWS_145,CKV2_AWS_62,CKV_AWS_18,CKV2_AWS_61,CKV_AWS_144,CKV2_AWS_5,CKV_AWS_130,CKV_AWS_231,CKV_AWS_338,CKV_AWS_158,CKV_AWS_355,CKV_AWS_290 \
            || exit 0

      - name: Upload Checkov Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-results
          path: results_sarif.sarif

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-security-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Skip Plan (Validation Only)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.deploy != 'yes'
        run: |
          echo "Skipping Terraform Plan - this is a validation-only run"
          echo "Security scan has already validated the code"
          echo "To deploy to AWS, trigger workflow manually with deploy=yes"

      - name: Configure AWS Credentials
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'yes'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'yes'
        run: terraform init

      - name: Terraform Plan
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'yes'
        id: plan
        run: terraform plan -out=tfplan

      - name: Upload Plan
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: tfplan
          retention-days: 1

  terraform-apply:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'yes'
    environment:
      name: production
      url: https://console.aws.amazon.com/ec2/v2/home?region=us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}

      - name: Show Plan
        run: terraform show tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Get Outputs
        id: outputs
        run: |
          echo "instance_id=$(terraform output -raw instance_id)" >> $GITHUB_OUTPUT
          echo "vpc_id=$(terraform output -raw vpc_id)" >> $GITHUB_OUTPUT
          echo "bucket_name=$(terraform output -raw bucket_name)" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        run: |
          echo "### Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Instance ID**: ${{ steps.outputs.instance_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**VPC ID**: ${{ steps.outputs.vpc_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**S3 Bucket**: ${{ steps.outputs.bucket_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View in AWS Console](https://console.aws.amazon.com/ec2/v2/home?region=us-east-1)" >> $GITHUB_STEP_SUMMARY

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [terraform-security-scan, terraform-plan]
    if: always()

    steps:
      - name: Report Status
        run: |
          echo "Security Scan: ${{ needs.terraform-security-scan.result }}"
          echo "Terraform Plan: ${{ needs.terraform-plan.result }}"

          if [[ "${{ needs.terraform-security-scan.result }}" == "failure" ]]; then
            echo "Pipeline BLOCKED due to security issues!"
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.deploy }}" == "yes" ]]; then
            echo "Deployment triggered - check terraform-apply job"
          else
            echo "All checks passed! Ready for deployment"
          fi
